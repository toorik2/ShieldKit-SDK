developer_instructions = """
Work only in the assigned lane subtree and isolated .vc run directory.
Read the root AGENTS.md and the lane's nested AGENTS.md before acting.
Refuse to work from the shared primary checkout; require an arena assignment.
Do not edit the judge, harness, vendor, shared packages, catalogue apex files, artifact registry, or another lane.
